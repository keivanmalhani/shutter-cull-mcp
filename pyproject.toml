[project]
name = "shutter-cull-mcp"
version = "0.1.0"
description = "Write-capable MCP server for shutter-cull: agents propose photo culls, humans confirm, every write is reversible"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Keivan Malhani" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "agentic-ai",
    "photography",
    "photo-culling",
    "local-first",
]
dependencies = [
    # mcp 2.0.0 on PyPI dropped mcp.server.fastmcp for a different,
    # unreleased API. shutter-mcp hit this and pinned; same pin here.
    "mcp[cli]>=1.2.0,<2.0.0",
]

[project.optional-dependencies]
# The engine is not a hard dependency: the safety envelope this server is
# made of is testable, and useful to audit, without the CV stack present.
# server_status reports honestly when the engine is missing.
engine = ["shutter-cull"]
dev = ["pytest>=8.0.0"]

[project.scripts]
shutter-cull-mcp = "shutter_cull_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shutter_cull_mcp"]
