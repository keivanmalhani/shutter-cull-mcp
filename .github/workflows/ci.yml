name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The suite runs against a fake engine on purpose, so CI needs
      # neither the CV stack nor exiftool. That is the point of the
      # adapter boundary in engine.py.
      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q
